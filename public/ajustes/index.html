<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111513">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" href="/media/icon-192.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <title>Ajustes · Arte al oído</title>
</head>
<body data-page="ajustes">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="top"><div class="shell top-inner">
    <a class="brand" href="/" aria-label="Arte al oído, inicio"><span class="brand-mark">≈</span>Arte<span class="brand-accent"> al oído</span></a>
    <nav aria-label="Navegación principal"><a href="/galeria/">Galería</a><a href="/buscar/">Buscar</a><a href="/ajustes/" aria-current="page">Ajustes</a></nav>
  </div></header>
  <main id="contenido" class="shell" tabindex="-1">
    <section class="page">
      <a class="breadcrumbs" href="/">Inicio</a>
      <div class="page-heading"><h1 tabindex="-1">Ajustes de audio</h1><p class="muted">Personaliza cómo se escucha y se muestra la galería.</p></div>
      <div class="stack">
        <section class="panel stack"><h2>Narración y ambiente</h2>
          <label class="field"><span>Velocidad de narración <output id="rate-value"></output></span><input id="rate" type="range" min=".65" max="1.55" step=".05" value="1"></label>
          <label class="field"><span>Volumen del ambiente y efectos <output id="volume-value"></output></span><input id="volume" type="range" min="0" max="1" step=".05" value=".25"></label>
          <label class="check"><input id="automatic" type="checkbox" checked> Reproducir fichas e introducciones al navegar</label>
          <button type="button" class="button" id="test-audio">Probar narración y ambiente</button>
        </section>
        <section class="panel stack"><h2>Pantalla y tacto</h2>
          <label class="field"><span>Intensidad de vibración</span><select id="haptic"><option value="0">Desactivada</option><option value="1">Suave</option><option value="2">Intensa</option></select></label>
          <p class="muted small">La vibración requiere un navegador y un dispositivo compatibles.</p>
          <label class="check"><input id="contrast" type="checkbox"> Alto contraste</label>
          <label class="check"><input id="large" type="checkbox"> Texto grande</label>
        </section>
      </div>
    </section>
  </main>
  <footer class="shell footer"><span>Arte al oído</span><span>Galería táctil y sonora</span></footer>
  <div id="route-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <audio id="voice" preload="auto" playsinline></audio><audio id="ambience" preload="none" playsinline loop></audio><audio id="effect" preload="none" playsinline></audio>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
