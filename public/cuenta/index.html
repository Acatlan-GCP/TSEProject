<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111513">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" href="/media/icon-192.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <title>Cuenta · Arte al oído</title>
</head>
<body data-page="cuenta">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="top"><div class="shell top-inner">
    <a class="brand" href="/" aria-label="Arte al oído, inicio"><span class="brand-mark">≈</span>Arte<span class="brand-accent"> al oído</span></a>
    <nav aria-label="Navegación principal"><a id="admin-link" href="/admin/" hidden>Administrar</a><a href="/galeria/" aria-current="page">Galería</a><a href="/buscar/">Buscar</a><a href="/ajustes/">Ajustes</a></nav>
  </div></header>
  <main id="contenido" class="shell" tabindex="-1">
    <section class="page">
      <a class="breadcrumbs" href="/ajustes/">Ajustes</a>
      <div class="page-heading"><h1 tabindex="-1">Cuenta</h1></div>
      <div class="stack">
        <form class="panel stack" id="account-form">
          <p>Inicia sesión para sincronizar tus ajustes entre dispositivos.</p>
          <label class="field"><span>Correo electrónico</span><input name="email" type="email" autocomplete="email" required></label>
          <label class="field"><span>Contraseña</span><input name="password" type="password" minlength="6" autocomplete="current-password" required></label>
          <div class="row"><button class="button primary" type="submit" value="login">Iniciar sesión</button><button class="button" type="submit" value="register" id="register" hidden>Crear cuenta</button></div>
          <p id="account-form-status" role="status"></p>
        </form>
        <section class="panel stack" id="account-session" hidden>
          <p id="session-email"></p>
          <button class="button primary" id="save-cloud">Guardar ajustes en la nube</button>
          <button class="button" id="load-cloud">Cargar ajustes de la nube</button>
          <button class="button" id="sign-out">Cerrar sesión</button>
          <p id="account-status" role="status"></p>
          <a class="button" href="/curaduria/" id="curator-link" hidden>Abrir curaduría</a>
        </section>
      </div>
    </section>
  </main>
  <footer class="shell footer"><span>Arte al oído</span><span>Galería táctil y sonora</span></footer>
  <div id="route-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <audio id="voice" preload="auto" playsinline></audio><audio id="ambience" preload="none" playsinline loop></audio><audio id="effect" preload="none" playsinline></audio>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
