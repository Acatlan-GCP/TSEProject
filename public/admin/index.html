<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Arte al oído</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <div class="container">
    <h1>Panel de Administración</h1>

    <!-- VISTA: AUTENTICACIÓN -->
    <div id="view-auth" class="view">
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Iniciar sesión</button>
        <button class="tab-btn" data-tab="register">Registrarse</button>
      </div>

      <!-- Formulario Login -->
      <form id="form-login" class="auth-form">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="login-email" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
        <div id="login-error" class="error-msg" hidden></div>
      </form>

      <!-- Formulario Registro -->
      <form id="form-register" class="auth-form" hidden>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="reg-email" required>
        </div>
        <div class="form-group">
          <label>Contraseña (mín. 6 caracteres)</label>
          <input type="password" id="reg-password" required minlength="6">
        </div>
        <div class="form-group">
          <label>Nombre real</label>
          <input type="text" id="reg-realname" required>
        </div>
        <div class="form-group">
          <label>Nombre de usuario (único)</label>
          <input type="text" id="reg-username" required pattern="[a-zA-Z0-9_]{3,30}" title="Solo letras, números y guiones bajos, 3-30 caracteres">
        </div>
        <button type="submit" class="btn-primary">Crear cuenta</button>
        <div id="reg-error" class="error-msg" hidden></div>
      </form>
    </div>

    <!-- VISTA: DASHBOARD -->
    <div id="view-dashboard" class="view" hidden>
      <div class="dashboard-header">
        <p>Bienvenido, <strong id="user-display-name"></strong> (<span id="user-role"></span>)</p>
        <div>
          <button id="btn-new-work" class="btn-primary">➕ Nueva obra</button>
          <button id="btn-logout" class="btn-secondary">Salir</button>
        </div>
      </div>
      <div id="works-list" class="works-grid"></div>
    </div>

    <!-- VISTA: EDITOR DE OBRA -->
    <div id="view-editor" class="view" hidden>
      <button id="btn-back" class="btn-secondary">← Volver</button>
      <h2 id="editor-title">Nueva obra</h2>

      <form id="form-work" class="editor-form">
        <div class="form-group">
          <label>Autor de la obra</label>
          <input type="text" id="work-author" required>
        </div>
        <div class="form-group">
          <label>Lugar de exposición</label>
          <input type="text" id="work-exhibition" required>
        </div>
        <div class="form-group">
          <label>Imagen de la obra</label>
          <input type="file" id="work-image" accept="image/jpeg,image/png,image/webp">
        </div>

        <!-- Zona de edición interactiva -->
        <h3>Vista previa de la imagen</h3>
        <div id="image-editor" class="image-editor" hidden>
          <img id="preview-image" src="" alt="Vista previa">
          <div id="zones-container"></div>
        </div>

        <div class="editor-section">
        
        <!-- Botón para agregar zona -->
        <button type="button" class="btn-add-zone" onclick="addZone()">
          ➕ Agregar zona
        </button>
        
        <!-- Lista de zonas (se llena automáticamente) -->
        <div id="zones-list" class="zones-list"></div>
      </div>

        <div class="editor-actions">
          <button type="button" id="btn-generate-ai" class="btn-secondary">🤖 Generar descripción y zonas con IA</button>
          <button type="button" id="btn-generate-audio" class="btn-secondary">🔊 Generar narración con ElevenLabs</button>
        </div>

        <div class="audio-controls" style="margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #dee2e6;">
          <h4>🎧 Narración de la obra</h4>
          
          <!-- Reproductor (se muestra si hay audio) -->
          <div id="audio-player-container" style="display: none; margin: 10px 0;">
            <audio id="audio-player" controls style="width: 100%;"></audio>
            <small style="color: #666;">Audio actual guardado en la obra</small>
          </div>
          
          <!-- Subir audio propio -->
          <div style="margin-top: 15px;">
            <label for="work-audio" style="display: block; margin-bottom: 5px; font-weight: 500;">
              📤 O sube tu propio audio (MP3, máx 10MB):
            </label>
            <input type="file" id="work-audio" accept="audio/mpeg,audio/mp3,audio/wav" 
                  style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            <button type="button" id="btn-upload-audio" 
                    style="margin-left: 10px; padding: 8px 16px; background: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer;">
              📤 Subir audio
            </button>
          </div>
          
          <div id="audio-success" style="display: none; margin-top: 10px; padding: 10px; background: #d4edda; color: #155724; border-radius: 4px;"></div>
          <div id="audio-error" style="display: none; margin-top: 10px; padding: 10px; background: #f8d7da; color: #721c24; border-radius: 4px;"></div>
        </div>

        <div class="form-group">
          <label>Descripción IA (editable)</label>
          <textarea id="work-description" rows="4"></textarea>
        </div>

        <div id="zones-list" class="zones-list"></div>

        <button type="submit" class="btn-primary">💾 Guardar obra</button>
        <div id="work-error" class="error-msg" hidden></div>
        <div id="work-success" class="success-msg" hidden></div>
      </form>
    </div>
  </div>

  <script src="./admin.js"></script>
</body>
</html>
