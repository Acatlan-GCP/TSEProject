<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111513">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" href="/media/icon-192.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <title>Galería · Arte al oído</title>
</head>
<body data-page="galeria">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="top"><div class="shell top-inner">
    <a class="brand" href="/" aria-label="Arte al oído, inicio"><span class="brand-mark">≈</span>Arte<span class="brand-accent"> al oído</span></a>
    <nav aria-label="Navegación principal"><a href="/galeria/" aria-current="page">Galería</a><a href="/buscar/">Buscar</a><a href="/ajustes/">Ajustes</a><a href="/admin/" class="admin-panel-link">Administración</a></nav>
  </div></header>
  <main id="contenido" class="shell" tabindex="-1">
    <section class="page">
      <a class="breadcrumbs" href="/">Inicio</a>
      <div class="page-heading">
        <h1 tabindex="-1">Menú principal</h1>
        <p class="muted">
          Bienvenido a Arte al oído. Selecciona una opción
          para comenzar a explorar.
        </p>
      </div>

      <section class="access-menu" aria-label="Menú principal">

        <button
          type="button"
          class="button primary access-button"
          id="welcome-audio">
          <span aria-hidden="true">▶</span>
          Escuchar bienvenida
        </button>

        <button
          type="button"
          class="button access-button"
          id="explore-works">
          <span aria-hidden="true">♫</span>
          Explorar obras
        </button>

        <a class="button access-button" href="/buscar/">
          <span aria-hidden="true">⌕</span>
          Buscar una obra
        </a>

        <a class="button access-button" href="/ajustes/">
          <span aria-hidden="true">⚙</span>
          Configuración
        </a>

      </section>

      <p
        id="welcome-status"
        class="sr-only"
        role="status"
        aria-live="polite">
      </p>

      <section id="gallery-content" hidden>
        <div class="catalog-focus" id="catalog-focus">
          <div id="current-work"></div>

          <div class="catalog-controls">
            <button type="button" class="button" id="previous">
              Anterior
            </button>

            <button type="button" class="button" id="summary">
              Escuchar ficha
            </button>

            <button type="button" class="button" id="next">
              Siguiente
            </button>
          </div>

          <p class="sr-only" id="catalog-status" role="status"></p>
        </div>

        <div class="cards" id="catalog-cards"></div>

        <button
          type="button"
          class="button access-button"
          id="back-to-menu">
          Volver al menú principal
        </button>
      </section>
    </section>
  </main>
  <footer class="shell footer"><span>Arte al oído</span><span>Galería táctil y sonora</span></footer>
  <div id="route-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <audio id="voice" preload="auto" playsinline></audio><audio id="ambience" preload="none" playsinline loop></audio><audio id="effect" preload="none" playsinline></audio>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
