
<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091827">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" href="/media/icon-192.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <title>Galería · Arte al oído</title>
</head>

<body data-page="galeria">
  <a class="skip" href="#contenido">Saltar al contenido</a>

  <header class="top">
    <div class="shell top-inner">
      <a class="brand" href="/" aria-label="Arte al oído, inicio">
        <span class="brand-mark" aria-hidden="true">≈</span>
        Arte<span class="brand-accent"> al oído</span>
      </a>

      <nav aria-label="Navegación principal">
        <a href="/menu/">Menú principal</a>
        <a href="/galeria/" aria-current="page">Galería</a>
        <a href="/buscar/">Buscar</a>
        <a href="/ajustes/">Ajustes</a>
        <a href="/admin/" class="admin-panel-link">Administración</a>
      </nav>
    </div>
  </header>

  <main id="contenido" class="shell" tabindex="-1">
    <section class="page">
      <a class="breadcrumbs" href="/menu/">Menú principal</a>

      <div class="page-heading">
        <h1 tabindex="-1">Explorar obras</h1>
        <p class="muted">
          Selecciona una obra para conocer su historia,
          explorar sus detalles y escuchar sus descripciones.
        </p>
      </div>

      <section id="gallery-content">
        <div class="catalog-focus" id="catalog-focus">
          <div id="current-work"></div>

          <div class="catalog-controls">
            <button type="button" class="button" id="previous">
              Anterior
            </button>

            <button type="button" class="button" id="summary">
              Escuchar ficha
            </button>

            <button type="button" class="button" id="next">
              Siguiente
            </button>
          </div>

          <p class="sr-only" id="catalog-status" role="status"></p>
        </div>

        <div class="cards" id="catalog-cards"></div>
      </section>

      <a class="button access-button" href="/menu/">
        Volver al menú principal
      </a>
    </section>
  </main>

  <footer class="shell footer">
    <span>Arte al oído</span>
    <span>Galería táctil y sonora</span>
  </footer>

  <div
    id="route-status"
    class="sr-only"
    role="status"
    aria-live="polite"
    aria-atomic="true">
  </div>

  <audio id="voice" preload="auto" playsinline></audio>
  <audio id="ambience" preload="none" playsinline loop></audio>
  <audio id="effect" preload="none" playsinline></audio>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
