<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091827">
  <meta name="description" content="Arte al oído: una galería accesible para explorar obras mediante narración, tacto y sonido.">

  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" href="/media/icon-192.png">
  <link rel="apple-touch-icon" href="/media/icon-192.png">
  <link rel="stylesheet" href="/assets/css/styles.css">

  <title>Arte al oído</title>
</head>

<body data-page="inicio" class="home-screen">

  <a class="skip" href="#contenido">Saltar al contenido</a>

  <main id="contenido" class="home-main" tabindex="-1">
    <section class="welcome-screen" aria-labelledby="welcome-title">

      <div class="welcome-brand">
        <span class="welcome-mark" aria-hidden="true">≈</span>
        <h1 id="welcome-title">Arte al oído</h1>
      </div>

      <a class="button primary home-cta" href="/galeria/">
        <span aria-hidden="true">♫</span>
        Explorar galería
      </a>

    </section>
  </main>

  <div
    id="route-status"
    class="sr-only"
    role="status"
    aria-live="polite"
    aria-atomic="true">
  </div>

  <audio id="voice" preload="auto" playsinline></audio>
  <audio id="ambience" preload="none" playsinline loop></audio>
  <audio id="effect" preload="none" playsinline></audio>

  <script type="module" src="/assets/js/app.js"></script>

</body>
</html>
